<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faron &amp; Darren · 05 | 12 | 26</title>
  <meta name="description" content="Share your photos from Faron &amp; Darren's wedding at Abbey House Hotel &amp; Gardens.">
  <meta name="theme-color" content="#323232">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,500&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #323232;
      --white: #ffffff;
      --muted: #b5b5b7;
      --line: rgba(255, 255, 255, 0.2);
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Open Sans', 'Helvetica Neue', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--white);
    }

    body {
      font-family: var(--sans);
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    section, main, footer { background: var(--bg); }

    img { max-width: 100%; height: auto; }

    .page {
      max-width: 1320px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    /* Hand-lettered headings, lifted from the printed invite */
    .script {
      display: block;
      margin: 0 auto;
    }

    /* ── Header ────────────────────────────────────────── */
    .invite {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 56px;
      padding-bottom: 72px;
    }

    .names-wrap { margin: 0; }

    .date {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0.18em;
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(3.4rem, 9vw, 5.6rem);
      line-height: 1;
      letter-spacing: 0.02em;
      margin: 48px 0 0;
      font-variant-numeric: lining-nums;
    }

    .date .bar {
      display: block;
      width: 1px;
      height: 0.5em;
      background: var(--white);
      transform: translateY(0.14em);
    }

    .venue {
      font-family: var(--sans);
      font-weight: 300;
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin: 36px 0 0;
      line-height: 1.4;
    }

    /* ── Upload zone ───────────────────────────────────── */
    .upload {
      width: 100%;
      max-width: 420px;
      margin-top: 56px;
    }

    .upload__card {
      position: relative;
      padding: 44px 28px 34px;
      border: 1px solid var(--line);
      text-align: center;
      transition: border-color 0.4s ease;
    }

    .upload__card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      pointer-events: none;
    }

    .upload__card.is-dragover,
    .upload__card:focus-within {
      border-color: rgba(255, 255, 255, 0.45);
    }

    .upload__icon {
      display: block;
      width: 48px;
      height: 48px;
      margin: 0 auto 22px;
      color: var(--white);
      opacity: 0.9;
    }

    .upload__lead {
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0 0 20px;
    }

    .upload__input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .upload__trigger {
      display: inline-block;
      font-family: var(--sans);
      font-size: 0.78rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--white);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 8px;
      text-decoration-color: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      padding: 6px 2px;
      transition: text-decoration-color 0.3s ease, opacity 0.3s ease;
    }

    .upload__trigger:hover { text-decoration-color: var(--white); }

    .upload__input:focus-visible + .upload__trigger {
      outline: 1px solid var(--line);
      outline-offset: 6px;
    }

    .upload__card.is-busy .upload__trigger {
      opacity: 0.35;
      pointer-events: none;
    }

    .upload__status {
      min-height: 1.6em;
      margin: 20px 0 0;
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .upload__status.is-pulsing { animation: breathe 1.8s ease-in-out infinite; }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* ── Gallery ───────────────────────────────────────── */
    .gallery {
      border-top: 1px solid var(--line);
      padding-top: 64px;
      padding-bottom: 96px;
    }

    .gallery__title {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      text-align: center;
      margin: 0 0 12px;
    }

    .gallery__sub {
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 48px;
    }

    /* Justified grid: tiles are positioned by layoutGrid() in the script */
    .tiles {
      position: relative;
    }

    .tiles__item {
      position: absolute;
      margin: 0;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      opacity: 0;
      animation: rise 0.8s ease forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    .tiles__item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(110%);
      transition: all 0.5s ease;
    }

    @media (hover: hover) {
      .tiles__item:hover img {
        transform: scale(1.03);
        filter: grayscale(0%);
      }
    }

    .tiles__item:focus-visible img {
      transform: scale(1.03);
      filter: grayscale(0%);
    }

    .tiles__item:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.6); outline-offset: 3px; }

    .gallery__empty {
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      color: var(--muted);
      margin: 8px 0 0;
    }

    /* ── Full photo view ───────────────────────────────── */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #19191b;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0s linear 0.35s;
    }

    .viewer.is-open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s ease;
    }

    .viewer__img {
      max-width: calc(100vw - 160px);
      max-height: calc(100vh - 140px);
      max-height: calc(100dvh - 140px);
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.25s ease;
    }

    .viewer__img.is-loading { opacity: 0; }

    .viewer__btn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--white);
      opacity: 0.75;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .viewer__btn:hover, .viewer__btn:focus-visible { opacity: 1; }
    .viewer__btn:focus-visible { outline: 1px solid var(--line); }
    .viewer__btn svg { width: 28px; height: 28px; }
    .viewer__btn[hidden] { display: none; }

    .viewer__close { top: 14px; right: 14px; }
    .viewer__prev  { left: 18px; top: 50%; transform: translateY(-50%); }
    .viewer__next  { right: 18px; top: 50%; transform: translateY(-50%); }

    .viewer__bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 28px;
      padding: 0 16px calc(22px + env(safe-area-inset-bottom));
    }

    .viewer__count {
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .viewer__save {
      font-size: 0.7rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--white);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 6px;
      text-decoration-color: rgba(255, 255, 255, 0.45);
    }

    @media (max-width: 600px) {
      .viewer__img { max-width: 100vw; max-height: calc(100dvh - 150px); }
      .viewer__prev, .viewer__next { display: none; }   /* swipe instead */
    }

    /* ── Footer ────────────────────────────────────────── */
    .colophon {
      border-top: 1px solid var(--line);
      padding-top: 32px;
      padding-bottom: 40px;
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 600px) {
      .page { padding-left: 16px; padding-right: 16px; }
      .invite { padding-top: 40px; padding-bottom: 56px; }
      .names { width: 240px; }
      .date { margin-top: 36px; }
      .venue { letter-spacing: 0.18em; }

      /* Edge-to-edge gallery on phones */
      .tiles { margin: 0 -16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tiles__item, .upload__status.is-pulsing { animation: none; opacity: 1; }
      .viewer, .viewer__img { transition: none; }
      .tiles__item img { transition: none; }
    }
  </style>
</head>
<body>

  <main class="invite page">
    <h1 class="names-wrap">
      <img class="script names" src="assets/names.png" width="290" height="325" alt="Faron &amp; Darren">
    </h1>

    <p class="date" aria-label="5 December 2026">
      <span>05</span><span class="bar"></span><span>12</span><span class="bar"></span><span>26</span>
    </p>

    <p class="venue">Abbey House Hotel &amp; Gardens</p>

    <section class="upload" aria-labelledby="upload-label">
      <div class="upload__card" id="dropzone">
        <svg class="upload__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 15.5h8.5l3.2-4.5h12.6l3.2 4.5H42a1.5 1.5 0 0 1 1.5 1.5v20A1.5 1.5 0 0 1 42 38.5H6A1.5 1.5 0 0 1 4.5 37V17A1.5 1.5 0 0 1 6 15.5Z"/>
          <circle cx="24" cy="26.5" r="7.5"/>
          <circle cx="24" cy="26.5" r="4"/>
          <path d="M9 20.5h3.5"/>
          <path d="M37.5 20.5h.01"/>
        </svg>

        <p class="upload__lead">Help us remember the day through your eyes</p>

        <input class="upload__input" id="photo-input" type="file" accept="image/*" multiple>
        <label class="upload__trigger" id="upload-label" for="photo-input">Upload your wedding photos</label>

        <p class="upload__status" id="status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <section class="gallery page" aria-labelledby="gallery-title">
    <h2 class="gallery__title" id="gallery-title">The Shared Gallery</h2>
    <p class="gallery__sub">Moments captured by our guests</p>
    <div class="tiles" id="grid"></div>
    <p class="gallery__empty" id="empty" hidden>The first memory is waiting to be shared.</p>
  </section>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
    <img class="viewer__img" id="viewer-img" alt="A guest photo from the wedding">
    <button class="viewer__btn viewer__close" id="viewer-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <button class="viewer__btn viewer__prev" id="viewer-prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg>
    </button>
    <button class="viewer__btn viewer__next" id="viewer-next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg>
    </button>
    <div class="viewer__bar">
      <span class="viewer__count" id="viewer-count"></span>
      <a class="viewer__save" id="viewer-save" href="#">Save photo</a>
    </div>
  </div>

  <footer class="colophon page">
    Faron &amp; Darren · 05 | 12 | 26
  </footer>

  <script>
    /* ── Configuration ─────────────────────────────────────────────
       CLOUD_NAME     – your Cloudinary cloud name (Dashboard → Product Environment)
       UPLOAD_PRESET  – an *unsigned* upload preset (Settings → Upload → Upload presets)
       TAG            – every upload is tagged with this so the gallery can list it
       Note: the public list endpoint only works once "Resource list" is
       un-ticked under Settings → Security → Restricted media types.
    ─────────────────────────────────────────────────────────────── */
    const CLOUD_NAME    = 'pzlb8o6s';
    const UPLOAD_PRESET = 'wedding_uploads';
    const TAG           = 'wedding_gallery';

    const UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
    const LIST_URL   = `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG}.json`;
    const DELIVERY   = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/`;

    const input    = document.getElementById('photo-input');
    const card     = document.getElementById('dropzone');
    const statusEl = document.getElementById('status');
    const grid     = document.getElementById('grid');
    const emptyEl  = document.getElementById('empty');

    const tiles = new Map();      // public_id -> { el, ar } for every tile in the grid
    let known = [];               // all resources, newest first

    const isConfigured = !CLOUD_NAME.startsWith('YOUR_') && !UPLOAD_PRESET.startsWith('YOUR_');

    function setStatus(text, pulsing = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle('is-pulsing', pulsing);
    }

    function imageUrl(r, transform = 'w_600,q_auto,f_auto') {
      const version = r.version ? `v${r.version}/` : '';
      return `${DELIVERY}${transform}/${version}${r.public_id}.${r.format || 'jpg'}`;
    }

    function buildItem(r) {
      const figure = document.createElement('figure');
      figure.className = 'tiles__item';
      figure.tabIndex = 0;
      figure.dataset.id = r.public_id;
      figure.setAttribute('role', 'button');
      figure.setAttribute('aria-label', 'Open photo');

      const img = document.createElement('img');
      img.src = imageUrl(r);
      img.alt = 'A guest photo from the wedding';
      img.loading = 'lazy';
      img.decoding = 'async';
      const tile = { el: figure, ar: r.width && r.height ? r.width / r.height : 0 };
      if (!tile.ar) {
        // Dimensions unknown until the image arrives: assume square, then re-tile
        tile.ar = 1;
        img.addEventListener('load', () => {
          if (img.naturalWidth && img.naturalHeight) {
            tile.ar = img.naturalWidth / img.naturalHeight;
            layoutGrid();
          }
        }, { once: true });
      }

      figure.appendChild(img);
      return tile;
    }

    /* Justified layout: fill each row edge to edge, keeping every photo's
       own shape. Rows aim for about three photos (fewer for wide shots,
       more for tall ones); the row height that lands closest to the target
       decides where each row breaks. */
    function layoutGrid() {
      const W = grid.clientWidth;
      if (!W || !known.length) { grid.style.height = '0px'; return; }

      const gap = W < 600 ? 3 : 8;
      const target = Math.min((W - 2 * gap) / 3, 360);
      const items = known.map(r => tiles.get(r.public_id)).filter(Boolean);

      const rows = [];
      let row = [], sum = 0;
      const heightFor = (n, s) => (W - gap * (n - 1)) / s;

      for (const t of items) {
        row.push(t);
        sum += t.ar;
        const h = heightFor(row.length, sum);
        if (h > target) continue;               // row still too tall: keep adding

        if (row.length > 1) {
          const hWithout = heightFor(row.length - 1, sum - t.ar);
          if (Math.abs(Math.log(hWithout / target)) < Math.abs(Math.log(h / target))) {
            row.pop();
            rows.push({ items: row, h: hWithout, full: true });
            row = [t]; sum = t.ar;
            const hAlone = heightFor(1, sum);
            if (hAlone <= target) { rows.push({ items: row, h: hAlone, full: true }); row = []; sum = 0; }
            continue;
          }
        }
        rows.push({ items: row, h, full: true });
        row = []; sum = 0;
      }
      // Last, unfilled row: keep the target height rather than stretching
      if (row.length) rows.push({ items: row, h: Math.min(target, heightFor(row.length, sum)), full: false });

      let y = 0;
      for (const { items: rowItems, h, full } of rows) {
        // centre the last, unfilled row
        const rowWidth = rowItems.reduce((w, t) => w + t.ar * h, 0) + gap * (rowItems.length - 1);
        let x = full ? 0 : Math.max(0, (W - rowWidth) / 2);
        rowItems.forEach((t, i) => {
          // the final tile in a full row absorbs rounding so edges line up
          const w = full && i === rowItems.length - 1 ? W - x : t.ar * h;
          Object.assign(t.el.style, {
            left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`
          });
          x += w + gap;
        });
        y += h + gap;
      }
      grid.style.height = `${Math.max(0, y - gap)}px`;
    }

    let lastWidth = 0;
    new ResizeObserver(() => {
      if (grid.clientWidth !== lastWidth) { lastWidth = grid.clientWidth; layoutGrid(); }
    }).observe(grid);

    // Merge new resources, add tiles for any new ones, then re-tile.
    function render(resources) {
      const byId = new Map(known.map(r => [r.public_id, r]));
      resources.forEach(r => byId.set(r.public_id, r));
      known = [...byId.values()].sort((a, b) =>
        new Date(b.created_at || 0) - new Date(a.created_at || 0));

      known.forEach(r => {
        if (!tiles.has(r.public_id)) {
          const tile = buildItem(r);
          tiles.set(r.public_id, tile);
          grid.appendChild(tile.el);   // DOM order doesn't matter; layoutGrid() places it
        }
      });
      layoutGrid();
      emptyEl.hidden = known.length > 0;
    }

    async function loadGallery() {
      if (!isConfigured) {
        emptyEl.hidden = false;
        emptyEl.textContent = 'Gallery not yet configured — add your Cloudinary details.';
        return;
      }
      try {
        // Cache-buster: the list endpoint is CDN-cached for ~60s.
        const res = await fetch(`${LIST_URL}?t=${Date.now()}`);
        if (res.status === 404) { render([]); return; }   // tag has no images yet
        if (!res.ok) throw new Error(`List request failed (${res.status})`);
        const data = await res.json();
        render(data.resources || []);
      } catch (err) {
        console.error(err);
        if (!known.length) {
          emptyEl.hidden = false;
          emptyEl.textContent = 'The gallery could not be reached just now.';
        }
      }
    }

    // Shrink large photos on the guest's phone before sending: keeps them
    // under Cloudinary's 10 MB free-plan limit and speeds up venue Wi-Fi.
    const MAX_DIMENSION = 2500;
    const JPEG_QUALITY  = 0.85;
    const SHRINK_ABOVE  = 1.5 * 1024 * 1024;

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload  = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
        img.src = url;
      });
    }

    async function shrink(file) {
      if (file.size <= SHRINK_ABOVE || file.type === 'image/gif') return file;
      try {
        const img = await loadImage(file);   // browsers apply EXIF rotation here
        const scale = Math.min(1, MAX_DIMENSION / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', JPEG_QUALITY));
        if (!blob || blob.size >= file.size) return file;
        const name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
        return new File([blob], name, { type: 'image/jpeg' });
      } catch {
        return file;   // e.g. HEIC on a desktop browser – Cloudinary can still take the original
      }
    }

    async function uploadOne(file) {
      const body = new FormData();
      body.append('file', await shrink(file));
      body.append('upload_preset', UPLOAD_PRESET);
      body.append('tags', TAG);

      const res = await fetch(UPLOAD_URL, { method: 'POST', body });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error?.message || `Upload failed (${res.status})`);
      return json;
    }

    async function handleFiles(fileList) {
      const files = [...fileList].filter(f => f.type.startsWith('image/'));
      if (!files.length) return;

      if (!isConfigured) {
        setStatus('Uploads are not configured yet.');
        return;
      }

      card.classList.add('is-busy');
      let ok = 0, failed = 0;
      const uploaded = [];

      for (let i = 0; i < files.length; i++) {
        setStatus(files.length > 1
          ? `Sending memory ${i + 1} of ${files.length}…`
          : 'Sending memory…', true);
        try {
          uploaded.push(await uploadOne(files[i]));
          ok++;
          render(uploaded);   // show it straight away, before the list cache refreshes
        } catch (err) {
          console.error(err);
          failed++;
        }
      }

      card.classList.remove('is-busy');
      input.value = '';

      if (ok && !failed) setStatus(ok > 1 ? `${ok} memories shared — thank you.` : 'Memory shared — thank you.');
      else if (ok)       setStatus(`${ok} shared, ${failed} could not be sent.`);
      else               setStatus('Something went wrong — please try again.');

      loadGallery();
    }

    input.addEventListener('change', e => handleFiles(e.target.files));

    // Desktop drag & drop onto the card
    ['dragenter', 'dragover'].forEach(evt => card.addEventListener(evt, e => {
      e.preventDefault();
      card.classList.add('is-dragover');
    }));
    ['dragleave', 'drop'].forEach(evt => card.addEventListener(evt, e => {
      e.preventDefault();
      card.classList.remove('is-dragover');
    }));
    card.addEventListener('drop', e => {
      if (!card.classList.contains('is-busy')) handleFiles(e.dataTransfer.files);
    });

    /* ── Full photo view: tap a tile to open; swipe, arrows or keys to move ── */
    const viewer    = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewer-img');
    const countEl   = document.getElementById('viewer-count');
    const saveEl    = document.getElementById('viewer-save');
    const prevBtn   = document.getElementById('viewer-prev');
    const nextBtn   = document.getElementById('viewer-next');
    const FULL      = 'w_1600,h_1600,c_limit,q_auto,f_auto';
    let current = -1;
    let opener = null;

    function show(index) {
      if (index < 0 || index >= known.length) return;
      current = index;
      const r = known[index];
      viewerImg.classList.add('is-loading');
      viewerImg.onload = () => viewerImg.classList.remove('is-loading');
      viewerImg.src = imageUrl(r, FULL);
      if (viewerImg.complete && viewerImg.naturalWidth) viewerImg.classList.remove('is-loading');   // cached
      saveEl.href = imageUrl(r, 'fl_attachment');
      countEl.textContent = `${index + 1} / ${known.length}`;
      prevBtn.hidden = index === 0;
      nextBtn.hidden = index === known.length - 1;
      // warm up the neighbours so swiping feels instant
      [index - 1, index + 1].forEach(i => {
        if (known[i]) new Image().src = imageUrl(known[i], FULL);
      });
    }

    function openViewer(index, fromEl) {
      opener = fromEl;
      show(index);
      viewer.classList.add('is-open');
      viewer.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      history.pushState({ viewer: true }, '');   // phone back button closes the photo
      document.getElementById('viewer-close').focus({ preventScroll: true });
    }

    function closeViewer() {
      if (!viewer.classList.contains('is-open')) return;
      viewer.classList.remove('is-open');
      viewer.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      current = -1;
      if (opener) opener.focus({ preventScroll: true });
    }

    // Close through history so the extra back-button entry is used up
    const requestClose = () => history.state?.viewer ? history.back() : closeViewer();
    window.addEventListener('popstate', closeViewer);

    grid.addEventListener('click', e => {
      const item = e.target.closest('.tiles__item');
      if (!item) return;
      const index = known.findIndex(r => r.public_id === item.dataset.id);
      if (index >= 0) openViewer(index, item);
    });

    grid.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('tiles__item')) {
        e.preventDefault();
        e.target.click();
      }
    });

    document.getElementById('viewer-close').addEventListener('click', requestClose);
    prevBtn.addEventListener('click', () => show(current - 1));
    nextBtn.addEventListener('click', () => show(current + 1));
    viewer.addEventListener('click', e => { if (e.target === viewer) requestClose(); });

    document.addEventListener('keydown', e => {
      if (!viewer.classList.contains('is-open')) return;
      if (e.key === 'Escape')     requestClose();
      if (e.key === 'ArrowLeft')  show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
    });

    // Swipe left/right to move between photos, swipe down to close
    let touchX = null, touchY = null;
    viewer.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { touchX = null; return; }   // leave pinch-zoom alone
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    }, { passive: true });

    viewer.addEventListener('touchend', e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      touchX = null;
      if (window.visualViewport && window.visualViewport.scale > 1.05) return;   // zoomed in: let them pan
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(current + (dx < 0 ? 1 : -1));
      else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) requestClose();
    }, { passive: true });

    loadGallery();
  </script>
</body>
</html>
