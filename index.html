<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faron &amp; Darren · 05 | 12 | 26</title>
  <meta name="description" content="Share your photos from Faron &amp; Darren's wedding at Abbey House Hotel &amp; Gardens.">
  <meta name="theme-color" content="#323232">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,500&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #323232;
      --white: #ffffff;
      --muted: #b5b5b7;
      --line: rgba(255, 255, 255, 0.2);
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Open Sans', 'Helvetica Neue', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--white);
    }

    body {
      font-family: var(--sans);
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    section, main, footer { background: var(--bg); }

    img { max-width: 100%; height: auto; }

    .page {
      max-width: 1320px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    /* Hand-lettered headings, lifted from the printed invite */
    .script {
      display: block;
      margin: 0 auto;
    }

    /* ── Header ────────────────────────────────────────── */
    .invite {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 56px;
      padding-bottom: 72px;
    }

    .names-wrap { margin: 0; }

    .date {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0.18em;
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(3.4rem, 9vw, 5.6rem);
      line-height: 1;
      letter-spacing: 0.02em;
      margin: 48px 0 0;
      font-variant-numeric: lining-nums;
    }

    .date .bar {
      display: block;
      width: 1px;
      height: 0.5em;
      background: var(--white);
      transform: translateY(0.14em);
    }

    .venue {
      font-family: var(--sans);
      font-weight: 300;
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin: 36px 0 0;
      line-height: 1.4;
    }

    /* ── Upload zone ───────────────────────────────────── */
    .upload {
      width: 100%;
      max-width: 420px;
      margin-top: 56px;
    }

    .upload__card {
      position: relative;
      padding: 44px 28px 34px;
      border: 1px solid var(--line);
      text-align: center;
      transition: border-color 0.4s ease;
    }

    .upload__card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      pointer-events: none;
    }

    .upload__card.is-dragover,
    .upload__card:focus-within {
      border-color: rgba(255, 255, 255, 0.45);
    }

    .upload__icon {
      display: block;
      width: 48px;
      height: 48px;
      margin: 0 auto 22px;
      color: var(--white);
      opacity: 0.9;
    }

    .upload__lead {
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0 0 20px;
    }

    .upload__input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .upload__trigger {
      display: inline-block;
      font-family: var(--sans);
      font-size: 0.78rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--white);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 8px;
      text-decoration-color: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      padding: 6px 2px;
      transition: text-decoration-color 0.3s ease, opacity 0.3s ease;
    }

    .upload__trigger:hover { text-decoration-color: var(--white); }

    .upload__input:focus-visible + .upload__trigger {
      outline: 1px solid var(--line);
      outline-offset: 6px;
    }

    .upload__card.is-busy .upload__trigger {
      opacity: 0.35;
      pointer-events: none;
    }

    .upload__status {
      min-height: 1.6em;
      margin: 20px 0 0;
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .upload__status.is-pulsing { animation: breathe 1.8s ease-in-out infinite; }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* ── Gallery ───────────────────────────────────────── */
    .gallery {
      border-top: 1px solid var(--line);
      padding-top: 64px;
      padding-bottom: 96px;
    }

    .gallery__title {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      text-align: center;
      margin: 0 0 12px;
    }

    .gallery__sub {
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 48px;
    }

    .masonry {
      column-count: 3;
      column-gap: 20px;
    }

    .masonry__item {
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      margin: 0 0 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      opacity: 0;
      animation: rise 0.8s ease forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    .masonry__item img {
      display: block;
      width: 100%;
      height: auto;
      filter: grayscale(100%) contrast(110%);
      transition: all 0.5s ease;
    }

    @media (hover: hover) {
      .masonry__item:hover img {
        transform: scale(1.03);
        filter: grayscale(0%);
      }
    }

    .masonry__item.is-revealed img,
    .masonry__item:focus-visible img {
      transform: scale(1.03);
      filter: grayscale(0%);
    }

    .masonry__item:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.6); outline-offset: 3px; }

    .gallery__empty {
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      color: var(--muted);
      margin: 8px 0 0;
    }

    /* ── Footer ────────────────────────────────────────── */
    .colophon {
      border-top: 1px solid var(--line);
      padding-top: 32px;
      padding-bottom: 40px;
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 960px) {
      .masonry { column-count: 2; column-gap: 16px; }
      .masonry__item { margin-bottom: 16px; }
    }

    @media (max-width: 600px) {
      .page { padding-left: 16px; padding-right: 16px; }
      .invite { padding-top: 40px; padding-bottom: 56px; }
      .names { width: 240px; }
      .date { margin-top: 36px; }
      .venue { letter-spacing: 0.18em; }
      .masonry { column-count: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .masonry__item, .upload__status.is-pulsing { animation: none; opacity: 1; }
      .masonry__item img { transition: none; }
    }
  </style>
</head>
<body>

  <main class="invite page">
    <h1 class="names-wrap">
      <img class="script names" src="assets/names.png" width="290" height="325" alt="Faron &amp; Darren">
    </h1>

    <p class="date" aria-label="5 December 2026">
      <span>05</span><span class="bar"></span><span>12</span><span class="bar"></span><span>26</span>
    </p>

    <p class="venue">Abbey House Hotel &amp; Gardens</p>

    <section class="upload" aria-labelledby="upload-label">
      <div class="upload__card" id="dropzone">
        <svg class="upload__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 15.5h8.5l3.2-4.5h12.6l3.2 4.5H42a1.5 1.5 0 0 1 1.5 1.5v20A1.5 1.5 0 0 1 42 38.5H6A1.5 1.5 0 0 1 4.5 37V17A1.5 1.5 0 0 1 6 15.5Z"/>
          <circle cx="24" cy="26.5" r="7.5"/>
          <circle cx="24" cy="26.5" r="4"/>
          <path d="M9 20.5h3.5"/>
          <path d="M37.5 20.5h.01"/>
        </svg>

        <p class="upload__lead">Help us remember the day through your eyes</p>

        <input class="upload__input" id="photo-input" type="file" accept="image/*" multiple>
        <label class="upload__trigger" id="upload-label" for="photo-input">Upload your wedding photos</label>

        <p class="upload__status" id="status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <section class="gallery page" aria-labelledby="gallery-title">
    <h2 class="gallery__title" id="gallery-title">The Shared Gallery</h2>
    <p class="gallery__sub">Moments captured by our guests</p>
    <div class="masonry" id="grid"></div>
    <p class="gallery__empty" id="empty" hidden>The first memory is waiting to be shared.</p>
  </section>

  <footer class="colophon page">
    Faron &amp; Darren · 05 | 12 | 26
  </footer>

  <script>
    /* ── Configuration ─────────────────────────────────────────────
       CLOUD_NAME     – your Cloudinary cloud name (Dashboard → Product Environment)
       UPLOAD_PRESET  – an *unsigned* upload preset (Settings → Upload → Upload presets)
       TAG            – every upload is tagged with this so the gallery can list it
       Note: the public list endpoint only works once "Resource list" is
       un-ticked under Settings → Security → Restricted media types.
    ─────────────────────────────────────────────────────────────── */
    const CLOUD_NAME    = 'YOUR_CLOUD_NAME';
    const UPLOAD_PRESET = 'YOUR_UNSIGNED_PRESET';
    const TAG           = 'wedding_gallery';

    const UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
    const LIST_URL   = `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG}.json`;
    const DELIVERY   = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/w_600,q_auto,f_auto/`;

    const input    = document.getElementById('photo-input');
    const card     = document.getElementById('dropzone');
    const statusEl = document.getElementById('status');
    const grid     = document.getElementById('grid');
    const emptyEl  = document.getElementById('empty');

    const rendered = new Set();   // public_ids already in the grid
    let known = [];               // all resources, newest first

    const isConfigured = !CLOUD_NAME.startsWith('YOUR_') && !UPLOAD_PRESET.startsWith('YOUR_');

    function setStatus(text, pulsing = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle('is-pulsing', pulsing);
    }

    function imageUrl(r) {
      const version = r.version ? `v${r.version}/` : '';
      return `${DELIVERY}${version}${r.public_id}.${r.format || 'jpg'}`;
    }

    function buildItem(r) {
      const figure = document.createElement('figure');
      figure.className = 'masonry__item';
      figure.tabIndex = 0;

      const img = document.createElement('img');
      img.src = imageUrl(r);
      img.alt = 'A guest photo from the wedding';
      img.loading = 'lazy';
      img.decoding = 'async';
      if (r.width && r.height) {
        // reserve space so columns don't jump while images load
        img.width = 600;
        img.height = Math.round(600 * r.height / r.width);
      }

      figure.appendChild(img);
      return figure;
    }

    // Merge new resources and re-render only if order changed.
    function render(resources) {
      const byId = new Map(known.map(r => [r.public_id, r]));
      resources.forEach(r => byId.set(r.public_id, r));
      known = [...byId.values()].sort((a, b) =>
        new Date(b.created_at || 0) - new Date(a.created_at || 0));

      const fresh = known.filter(r => !rendered.has(r.public_id));
      if (fresh.length) {
        // Newest first: prepend fresh ones in order at the top of the grid.
        const frag = document.createDocumentFragment();
        known.forEach(r => {
          if (!rendered.has(r.public_id)) {
            frag.appendChild(buildItem(r));
            rendered.add(r.public_id);
          }
        });
        grid.prepend(frag);
      }
      emptyEl.hidden = known.length > 0;
    }

    async function loadGallery() {
      if (!isConfigured) {
        emptyEl.hidden = false;
        emptyEl.textContent = 'Gallery not yet configured — add your Cloudinary details.';
        return;
      }
      try {
        // Cache-buster: the list endpoint is CDN-cached for ~60s.
        const res = await fetch(`${LIST_URL}?t=${Date.now()}`);
        if (res.status === 404) { render([]); return; }   // tag has no images yet
        if (!res.ok) throw new Error(`List request failed (${res.status})`);
        const data = await res.json();
        render(data.resources || []);
      } catch (err) {
        console.error(err);
        if (!known.length) {
          emptyEl.hidden = false;
          emptyEl.textContent = 'The gallery could not be reached just now.';
        }
      }
    }

    async function uploadOne(file) {
      const body = new FormData();
      body.append('file', file);
      body.append('upload_preset', UPLOAD_PRESET);
      body.append('tags', TAG);

      const res = await fetch(UPLOAD_URL, { method: 'POST', body });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error?.message || `Upload failed (${res.status})`);
      return json;
    }

    async function handleFiles(fileList) {
      const files = [...fileList].filter(f => f.type.startsWith('image/'));
      if (!files.length) return;

      if (!isConfigured) {
        setStatus('Uploads are not configured yet.');
        return;
      }

      card.classList.add('is-busy');
      let ok = 0, failed = 0;
      const uploaded = [];

      for (let i = 0; i < files.length; i++) {
        setStatus(files.length > 1
          ? `Sending memory ${i + 1} of ${files.length}…`
          : 'Sending memory…', true);
        try {
          uploaded.push(await uploadOne(files[i]));
          ok++;
          render(uploaded);   // show it straight away, before the list cache refreshes
        } catch (err) {
          console.error(err);
          failed++;
        }
      }

      card.classList.remove('is-busy');
      input.value = '';

      if (ok && !failed) setStatus(ok > 1 ? `${ok} memories shared — thank you.` : 'Memory shared — thank you.');
      else if (ok)       setStatus(`${ok} shared, ${failed} could not be sent.`);
      else               setStatus('Something went wrong — please try again.');

      loadGallery();
    }

    input.addEventListener('change', e => handleFiles(e.target.files));

    // Desktop drag & drop onto the card
    ['dragenter', 'dragover'].forEach(evt => card.addEventListener(evt, e => {
      e.preventDefault();
      card.classList.add('is-dragover');
    }));
    ['dragleave', 'drop'].forEach(evt => card.addEventListener(evt, e => {
      e.preventDefault();
      card.classList.remove('is-dragover');
    }));
    card.addEventListener('drop', e => {
      if (!card.classList.contains('is-busy')) handleFiles(e.dataTransfer.files);
    });

    // Tap to reveal colour (touch devices); one image revealed at a time
    grid.addEventListener('click', e => {
      const item = e.target.closest('.masonry__item');
      if (!item) return;
      const wasOpen = item.classList.contains('is-revealed');
      grid.querySelectorAll('.is-revealed').forEach(el => el.classList.remove('is-revealed'));
      if (!wasOpen) item.classList.add('is-revealed');
    });

    loadGallery();
  </script>
</body>
</html>
